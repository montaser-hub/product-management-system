<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management System</title>
    <meta
      name="description"
      content="A vanilla JavaScript inventory dashboard — create, edit, search and price products, persisted in localStorage."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 12l7-4 7 4v8l-7 4-7-4z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        let theme;
        try {
          theme = localStorage.getItem("pms.theme");
        } catch (e) {}
        if (!theme) {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 8l8-4.5L20 8v8l-8 4.5L4 16z" /><path d="M4 8l8 4.5L20 8M12 12.5V20.5" /></svg>
        </span>
        <div>
          <h1>Product Management</h1>
          <p>Inventory &amp; pricing dashboard</p>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      </button>
    </header>

    <main class="layout">
      <section class="stats" aria-label="Inventory summary">
        <article class="stat">
          <span class="stat-label">Products</span>
          <strong class="stat-value" id="statProducts">0</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Units in stock</span>
          <strong class="stat-value" id="statUnits">0</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Inventory value</span>
          <strong class="stat-value" id="statValue">$0</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Categories</span>
          <strong class="stat-value" id="statCategories">0</strong>
        </article>
      </section>

      <section class="card form-card" aria-labelledby="formHeading">
        <div class="card-head">
          <h2 id="formHeading">Add product</h2>
          <button id="cancelEdit" class="link-btn" type="button" hidden>Cancel</button>
        </div>

        <form id="productForm" novalidate autocomplete="off">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" placeholder="e.g. Wireless Keyboard" required maxlength="80" />
          </div>

          <fieldset class="pricing">
            <legend>Pricing</legend>
            <div class="grid-2">
              <div class="field">
                <label for="price">Price</label>
                <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required />
              </div>
              <div class="field">
                <label for="taxes">Taxes</label>
                <input id="taxes" name="taxes" type="number" min="0" step="0.01" placeholder="0.00" />
              </div>
              <div class="field">
                <label for="ads">Ads</label>
                <input id="ads" name="ads" type="number" min="0" step="0.01" placeholder="0.00" />
              </div>
              <div class="field">
                <label for="discount">Discount</label>
                <input id="discount" name="discount" type="number" min="0" step="0.01" placeholder="0.00" />
              </div>
            </div>
            <div class="total" id="total" data-state="empty">
              <span>Unit total</span>
              <strong id="totalValue">—</strong>
            </div>
          </fieldset>

          <div class="grid-2">
            <div class="field">
              <label for="category">Category</label>
              <input id="category" name="category" type="text" list="categoryList" placeholder="e.g. Accessories" required maxlength="40" />
              <datalist id="categoryList"></datalist>
            </div>
            <div class="field">
              <label for="count">Quantity</label>
              <input id="count" name="count" type="number" min="1" step="1" value="1" required />
            </div>
          </div>

          <p class="form-error" id="formError" role="alert"></p>
          <button id="submit" class="btn btn-primary" type="submit">Create product</button>
        </form>
      </section>

      <section class="card table-card" aria-labelledby="listHeading">
        <div class="card-head">
          <h2 id="listHeading">Products</h2>
          <div class="card-actions">
            <button id="resetDemo" class="btn btn-ghost" type="button">Reset sample data</button>
            <button id="deleteAll" class="btn btn-danger-ghost" type="button">Delete all</button>
          </div>
        </div>

        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
            <span class="sr-only">Search products</span>
            <input id="search" type="search" placeholder="Search by title…" />
          </label>
          <div class="segmented" role="radiogroup" aria-label="Search by">
            <button type="button" role="radio" data-mode="title" aria-checked="true">Title</button>
            <button type="button" role="radio" data-mode="category" aria-checked="false">Category</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Product</th>
                <th scope="col">Category</th>
                <th scope="col" class="num">Price</th>
                <th scope="col" class="num">Taxes</th>
                <th scope="col" class="num">Ads</th>
                <th scope="col" class="num">Discount</th>
                <th scope="col" class="num">Total</th>
                <th scope="col" class="num">Qty</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>
            <p id="emptyText">No products yet.</p>
          </div>
        </div>
        <p class="table-foot" id="resultCount"></p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
  </body>
</html>
